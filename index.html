<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#E8935A">
  <meta name="description" content="拾光 · 记账，也记日子。账单与生活记录汇成同一条时间线。">
  <title>拾光 · 记账，也记日子</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@latest/style.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <main id="pages">
      <section class="page" id="page-today"></section>
      <section class="page" id="page-timeline"></section>
      <section class="page" id="page-stats"></section>
      <section class="page" id="page-me"></section>
    </main>

    <nav id="tabbar">
      <button class="tab" data-page="today"><span class="tab-ico">☀️</span><span class="tab-txt">今天</span></button>
      <button class="tab" data-page="timeline"><span class="tab-ico">📖</span><span class="tab-txt">时间线</span></button>
      <div class="fab-wrap"><button id="fab" aria-label="记一下">＋</button></div>
      <button class="tab" data-page="stats"><span class="tab-ico">📊</span><span class="tab-txt">统计</span></button>
      <button class="tab" data-page="me"><span class="tab-ico">🧺</span><span class="tab-txt">我的</span></button>
    </nav>

    <div id="overlays"></div>
  </div>

  <script src="./js/util.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/composer.js"></script>
  <script src="./js/page-today.js"></script>
  <script src="./js/page-timeline.js"></script>
  <script src="./js/page-stats.js"></script>
  <script src="./js/page-me.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
